app = "pipboy"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.http_options]
    idle_timeout = 600

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
